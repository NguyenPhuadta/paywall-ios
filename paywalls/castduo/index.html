<h1>11 · Go Plus</h1>
<p>Review board · HTML simulation · App Store confirmation and real transactions are implemented by StoreKit.</p>
<div id="notice" class="notice"></div>
<main id="board"></main>
<script>
// SAMPLE DATA ONLY. Use displayPrice and offer facts confirmed for the actual storefront.
// sample:false never certifies App Review compliance; missing policy URLs remain warnings.
const CONFIG={sample:true,app:'CastDuo',store:'App Store',layout:'single',focus:'weekly',headline:'Your screen. Bigger.',benefits:'Cast your phone screen to your TV.',hero:{src:'',alt:''},accent:'#ffffff',dismissible:true,termsURL:'',privacyURL:'',supportURL:'',plans:[{id:'weekly',type:'subscription',group:'UNCONFIRMED',name:'Weekly',price:'$x.xx',period:'week',trialDuration:'3 days'}],locale:null};
const TEXT = {
  en:{trial:'Start Free Trial',subscribe:'Subscribe',buy:'Buy Once',checking:'Checking offer…',loading:'Loading plans…',loadError:'Plans couldn’t be loaded. Please try again.',retry:'Try Again',restore:'Restore Purchases',restoring:'Checking your purchases…',terms:'Terms of Use',privacy:'Privacy Policy',close:'Close paywall',once:'One-time purchase',continue:'Continue',done:'Done',processing:'Processing…',manage:'Manage Subscription',unknown:'Checking available offers. Purchase is unavailable until the offer is confirmed.',
    trialLine:(p)=>`${p.trialDuration} free, then ${p.price} per ${p.period}. Automatically renews unless canceled. Cancel at least 24 hours before the trial ends to avoid renewal. Manage in App Store account settings.`,
    subLine:(p)=>`${p.price} per ${p.period}. Automatically renews unless canceled. Manage or cancel in App Store account settings.`,lifeLine:p=>`${p.price}, one-time purchase. No subscription.`,trialTag:p=>`${p.trialDuration} free`,
    pending:'Your purchase is pending. Access will update once it’s confirmed.',cancelled:'Purchase canceled.',failed:'Your purchase couldn’t be completed. Please try again.',unverified:'We couldn’t confirm your access yet. Check again or contact support.',success:'Your access is ready.',active:'Your subscription is active.',restoreEmpty:'No active purchases found. Check the Apple Account used for your purchase.',restoreError:'Purchases couldn’t be restored. Please try again.',dismissed:'Paywall closed.',samplePolicy:'Sample — policy URL missing',policyMissing:'Provide the app’s actual policy URL before delivery.',policyBody:'This preview opens the configured policy. It does not generate or replace the app’s legal document.',openPolicy:'Open full document',system:'Prototype: choose a simulated result below this phone. The app must present the real App Store purchase sheet.'},
  ko:{trial:'무료 체험 시작',subscribe:'구독하기',buy:'한 번 구매',checking:'혜택 확인 중…',loading:'요금제 불러오는 중…',loadError:'요금제를 불러오지 못했습니다. 다시 시도해 주세요.',retry:'다시 시도',restore:'구매 복원',restoring:'구매 내역 확인 중…',terms:'이용 약관',privacy:'개인정보 처리방침',close:'닫기',once:'일회성 구매',continue:'계속',done:'완료',processing:'처리 중…',manage:'구독 관리',unknown:'이용 가능한 혜택을 확인하고 있습니다. 확인이 완료되면 구매할 수 있습니다.',
    trialLine:p=>`${p.trialDuration} 무료 체험 후 ${p.price}/${p.period}. 해지하지 않으면 자동 갱신됩니다. 갱신을 원하지 않으면 체험 종료 최소 24시간 전에 해지하세요. App Store 계정 설정에서 구독을 관리할 수 있습니다.`,
    subLine:p=>`${p.price}/${p.period}. 해지하지 않으면 자동 갱신됩니다. App Store 계정 설정에서 구독을 관리하거나 해지할 수 있습니다.`,lifeLine:p=>`${p.price} 일회성 구매. 구독이 아닙니다.`,trialTag:p=>`${p.trialDuration} 무료`,
    pending:'구매가 대기 중입니다. 확인 후 이용 권한이 업데이트됩니다.',cancelled:'구매가 취소되었습니다.',failed:'구매를 완료하지 못했습니다. 다시 시도해 주세요.',unverified:'이용 권한을 확인하지 못했습니다. 다시 확인하거나 지원팀에 문의하세요.',success:'이용 권한이 준비되었습니다.',active:'구독이 활성화되어 있습니다.',restoreEmpty:'활성 구매를 찾지 못했습니다. 구매에 사용한 Apple 계정을 확인하세요.',restoreError:'구매를 복원하지 못했습니다. 다시 시도해 주세요.',dismissed:'닫혔습니다.',samplePolicy:'샘플 — 정책 URL 없음',policyMissing:'최종 전달 전에 앱의 실제 정책 URL을 제공하세요.',policyBody:'설정된 정책 문서를 엽니다. 이 미리보기는 법률 문서를 생성하거나 대체하지 않습니다.',openPolicy:'전체 문서 열기',system:'프로토타입: 화면 아래에서 결과를 선택하세요. 실제 앱은 App Store 구매 화면을 사용해야 합니다.'}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(s){try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}}
function context(o){
  const L=o.locale?CONFIG.locale:null,S=TEXT[L?.lang]||TEXT.en;
  const plans=CONFIG.plans.map(p=>({...p,...L?.plans?.[p.id]}));
  const p=plans.find(p=>p.id===o.sel)||plans.find(p=>p.id===CONFIG.focus)||plans[0];
  const trial=o.eligibility==='eligible'&&p.type==='subscription'&&!!p.trialDuration;
  return {L,S,plans,p,trial};
}
const busyStates=['loading','unknown','purchasing','restoring','pending','unverified'];
const accessStates=['success','restored','active'];
function utility(S,o){return `<div class="utility"><button class="restore" data-action="restore" ${['purchasing','restoring'].includes(o.state)?'disabled':''}>${o.state==='restoring'?esc(S.restoring):esc(S.restore)}</button>${['terms','privacy'].map(k=>safeURL(CONFIG[k+'URL'])?`<a href="${esc(safeURL(CONFIG[k+'URL']))}" data-action="${k}">${esc(S[k])}</a>`:`<button data-action="${k}">${esc(S[k])}</button>`).join('')}</div>`}
function policySheet(o,S){
  if(!o.sheet)return '';const url=safeURL(CONFIG[o.sheet+'URL']);
  return `<div class="sheet-layer"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(S[o.sheet])}"><header><h3>${esc(S[o.sheet])}</h3><button class="close" data-action="closeSheet" aria-label="${esc(S.done)}">×</button></header><p>${esc(url?S.policyBody:S.policyMissing)}</p>${url?`<a target="_blank" rel="noopener" href="${esc(url)}">${esc(S.openPolicy)}</a>`:`<p class="sample-link">${esc(S.samplePolicy)}</p>`}</section></div>`;
}
function render(o){
  const {L,S,plans,p,trial}=context(o);const access=accessStates.includes(o.state),unavailable=['loading','load-error','empty'].includes(o.state);
  const header=`<header class="top"><span class="brand">${esc(CONFIG.app)}</span>${CONFIG.dismissible?`<button class="close" data-action="dismiss" aria-label="${esc(S.close)}">×</button>`:''}</header>`;
  const links=utility(S,o);
  if(o.state==='dismissed')return `${header}<div class="result"><p>${esc(S.dismissed)}</p><button class="primary" data-action="reset">${esc(S.continue)}</button></div>`;
  if(access)return `${header}<div class="result" role="status"><h2>${esc(o.state==='active'?S.active:S.success)}</h2><button class="primary" data-action="dismiss">${esc(S.continue)}</button>${p.type==='subscription'?`<a class="secondary" style="display:block;text-align:center" href="https://apps.apple.com/account/subscriptions" target="_blank" rel="noopener">${esc(S.manage)}</a>`:''}</div><div class="pricing">${links}</div>${policySheet(o,S)}`;
  const story=`<section class="story"><div class="hero" aria-hidden="true">${CONFIG.hero.src?`<img src="${esc(CONFIG.hero.src)}" alt="${esc(CONFIG.hero.alt)}">`:'✦'}</div><h2>${esc(L?.headline||CONFIG.headline)}</h2><p>${esc(L?.benefits||CONFIG.benefits)}</p></section>`;
  let selector='';
  if(o.state==='loading')selector=`<div class="skeleton" role="status">${esc(S.loading)}</div>`;
  else if(unavailable)selector=`<div class="status" role="status">${esc(S.loadError)}</div>`;
  else selector=`<div class="plans" role="radiogroup" aria-label="${L?'요금제':'Plans'}">${plans.map(q=>{const offered=o.eligibility==='eligible'&&q.type==='subscription'&&q.trialDuration;return `<button class="plan" role="radio" aria-checked="${q.id===p.id}" data-plan="${esc(q.id)}" ${busyStates.includes(o.state)?'disabled':''}><span class="radio" aria-hidden="true"></span><span class="plan-main"><span class="name">${esc(q.name)}</span><span class="detail">${esc(q.type==='non-consumable'?S.once:offered?S.trialTag(q):q.equivalent||'')}</span></span><span class="money">${esc(q.price)}${q.period?`<span class="period">/ ${esc(q.period)}</span>`:''}</span></button>`}).join('')}</div>`;
  const disclosure=unavailable?'':p.type==='non-consumable'?S.lifeLine(p):trial?S.trialLine(p):S.subLine(p);
  const statusKeys={'unknown':'unknown','pending':'pending','cancelled':'cancelled','purchase-error':'failed','unverified':'unverified','restore-empty':'restoreEmpty','restore-error':'restoreError','purchasing':'system','restoring':'restoring'};
  const status=statusKeys[o.state]?`<div class="status" role="status">${esc(S[statusKeys[o.state]])}</div>`:'';
  const cta=o.state==='loading'?S.loading:o.state==='unknown'?S.checking:o.state==='restoring'?S.restoring:o.state==='purchasing'?S.processing:o.state==='pending'?S.done:o.state==='unverified'?S.retry:unavailable?S.retry:p.type==='non-consumable'?S.buy:trial?S.trial:S.subscribe;
  const disabled=busyStates.includes(o.state)&&!['pending','unverified'].includes(o.state);
  const action=['load-error','empty'].includes(o.state)?'retry':o.state==='pending'?'dismiss':o.state==='unverified'?'recheck':'purchase';
  return `${header}${story}<section class="pricing">${selector}${status}<p class="disclosure">${esc(disclosure)}</p><button class="primary" data-action="${action}" ${disabled?'disabled':''}>${esc(cta)}</button>${CONFIG.supportURL&&['unverified','purchase-error','restore-error'].includes(o.state)?`<div class="utility"><a href="${esc(safeURL(CONFIG.supportURL))}">Contact Support</a></div>`:''}${links}</section>${policySheet(o,S)}`;
}
function check(o){
  const {p,trial}=context(o),w=[];
  if(CONFIG.store!=='App Store')w.push('Store must be App Store');
  if(!safeURL(CONFIG.termsURL)||!safeURL(CONFIG.privacyURL))w.push('Cần URL Terms/Privacy thật');
  if(!p?.price)w.push('Missing product price');
  if(p.type==='subscription'&&(!p.period||!p.group))w.push('Missing period/group');
  if(p.type==='non-consumable'&&(p.period||p.trialDuration))w.push('Non-consumable có subscription/trial fields');
  if(trial&&o.eligibility!=='eligible')w.push('Trial without confirmed eligibility');
  return w;
}
const FRAME_OPTS=[];
function frame(label,opts={}){
  const o={sel:CONFIG.focus,state:'ready',eligibility:'eligible',width:390,height:844,safeTop:24,safeBottom:20,scale:1,...opts};
  const i=FRAME_OPTS.push(o)-1;
  const classes=[o.height<=667?'compact':'',o.scale>1?'large-type':'',CONFIG.layout==='cards'?'cards':''].join(' ');
  return `<figure data-i="${i}"><div class="phone ${classes}" lang="${o.locale?CONFIG.locale.lang:'en'}" style="--w:${o.width}px;--h:${o.height}px;--safe-top:${o.safeTop}px;--safe-bottom:${o.safeBottom}px;--scale:${o.scale};--accent:${CONFIG.accent}"><div class="viewport" tabindex="0"><div class="screen">${render(o)}</div></div></div><figcaption>${esc(label)}</figcaption><div class="checks"></div><div class="review-tools" hidden></div></figure>`;
}
function board(){
  FRAME_OPTS.length=0;
  const rows=[['Layout & readability',[
    frame('iPhone · 390×844'),frame('Compact · 375×667',{width:375,height:667,safeTop:20,safeBottom:0}),
    frame('Text 200% · scroll to inspect',{scale:2}),frame('Safe area stress test',{safeTop:59,safeBottom:34}),
    ...(CONFIG.locale?[frame(CONFIG.locale.label,{locale:true})]:[])]],
    ['Offers & availability',[
      ...CONFIG.plans.map(p=>frame(p.type==='non-consumable'?'Lifetime · one time':p.name,{sel:p.id})),
      frame('Không đủ điều kiện trial',{eligibility:'ineligible'}),frame('Chưa biết eligibility',{state:'unknown',eligibility:'unknown'}),
      frame('Đang tải products',{state:'loading',eligibility:'unknown'}),frame('Lỗi tải products',{state:'load-error',eligibility:'unknown'}),frame('Không có product khả dụng',{state:'empty',eligibility:'unknown'})]],
    ['Purchase & entitlement',[
      frame('Đang mở App Store purchase sheet',{state:'purchasing'}),frame('User hủy · giữ selection',{state:'cancelled'}),frame('Pending · chưa unlock',{state:'pending'}),
      frame('Lỗi purchase',{state:'purchase-error'}),frame('Chưa xác minh transaction',{state:'unverified'}),frame('Verified success',{state:'success'}),frame('Đã có entitlement',{state:'active',eligibility:'ineligible'})]],
    ['Restore & policy',[
      frame('Đang restore',{state:'restoring'}),frame('Restore thành công · entitlement hợp lệ',{state:'restored'}),frame('Restore không tìm thấy quyền',{state:'restore-empty'}),frame('Restore lỗi',{state:'restore-error'}),frame('Terms reader',{sheet:'terms'}),frame('Privacy reader',{sheet:'privacy'})]]];
  document.querySelector('#board').innerHTML=rows.map(([title,frames])=>`<section class="row"><h2>${esc(title)}</h2><div class="frames">${frames.join('')}</div></section>`).join('');
  document.querySelector('#notice').textContent=CONFIG.sample?'SAMPLE — fictional app, prices and offers. Policy URLs are intentionally missing. This is a prototype, not a purchase screen connected to StoreKit.':'App data mode — verify product data, policy URLs, native accessibility and StoreKit behavior before delivery.';
  document.querySelectorAll('figure').forEach(update);
}
function update(fig){
  const i=+fig.dataset.i,o=FRAME_OPTS[i];fig.querySelector('.screen').innerHTML=render(o);
  const warnings=check(o);fig.querySelector('.checks').className='checks'+(warnings.length?' bad':'');
  fig.querySelector('.checks').textContent=(CONFIG.sample?'SAMPLE · ':'')+(warnings.length?'⚠ '+warnings.join(' · '):'Basic data checks passed · visual/native QA still required');
  const tools=fig.querySelector('.review-tools');
  const modes=o.state==='purchasing'?[['success','Verified success'],['pending','Pending'],['cancelled','Cancel'],['purchase-error','Error'],['unverified','Unverified']]:o.state==='restoring'?[['restored','Active entitlement'],['restore-empty','No entitlement'],['restore-error','Restore error']]:o.state==='unverified'?[['success','Verified entitlement'],['unverified','Still unresolved']]:o.state==='unknown'?[['ready','Eligible'],['ineligible','Ineligible']]:[];
  tools.hidden=!modes.length;tools.innerHTML=modes.map(([state,label])=>`<button data-result="${state}">${esc(label)}</button>`).join('');
}
document.addEventListener('click',e=>{
  const target=e.target.closest('[data-action],[data-plan],[data-result]');if(!target)return;
  const fig=target.closest('figure');if(!fig)return;const o=FRAME_OPTS[+fig.dataset.i];
  e.preventDefault();const plan=target.dataset.plan,result=target.dataset.result,action=target.dataset.action;
  if(plan){o.sel=plan;o.state='ready'}
  else if(result){o.state=result==='ineligible'?'ready':result;if(['ready','ineligible'].includes(result))o.eligibility=result==='ready'?'eligible':'ineligible'}
  else if(['terms','privacy'].includes(action))o.sheet=action;
  else if(action==='closeSheet')o.sheet=null;
  else if(action==='dismiss')o.state='dismissed';
  else if(action==='reset'){o.state='ready';o.sheet=null}
  else if(action==='retry'){o.state='unknown';o.eligibility='unknown'}
  else if(action==='purchase')o.state='purchasing';
  else if(action==='restore')o.state='restoring';
  else if(action==='recheck')o.state='unverified';
  update(fig);
  if(o.sheet)fig.querySelector('.sheet button')?.focus();
});
document.addEventListener('keydown',e=>{
  const dialog=e.target.closest('[role="dialog"]');
  if(e.key==='Tab'&&dialog){const focusable=[...dialog.querySelectorAll('button:not(:disabled),a[href]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&e.target===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&e.target===last){e.preventDefault();first?.focus()}}
  if(e.key==='Escape'){const fig=e.target.closest('figure');if(fig){const o=FRAME_OPTS[+fig.dataset.i];if(o.sheet){o.sheet=null;update(fig);fig.querySelector('[data-action="terms"]')?.focus()}}}
